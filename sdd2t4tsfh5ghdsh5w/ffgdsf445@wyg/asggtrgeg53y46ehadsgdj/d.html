<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8合1全能编译器 纯HTML离线版</title>

<!-- 在线依赖解释器 -->
<script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fengari-web@0.1.2/dist/fengari-web.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
html,body{height:100%;background:#121212;color:#fff;display:flex;flex-direction:column}
.top{
  position:fixed;top:0;left:0;right:0;height:70px;
  background:#222;display:flex;align-items:center;gap:8px;padding:0 10px;z-index:10;
}
body{padding-top:70px;padding-bottom:80px}
.btn{padding:12px 14px;border:0;border-radius:8px;color:#fff;font-weight:bold;font-size:14px}
#open{background:#2ECC71}
#clear{background:#E74C3C}
#run{background:#F1C40F;color:#000}
select{padding:12px;border-radius:8px;background:#333;color:#fff;border:0;font-size:14px;flex:1}
.editorWrap{flex:1;display:flex;min-height:220px;overflow:hidden;}
#lines{
  width:50px;background:#181818;color:#888;padding:15px 5px;
  font-size:13px;text-align:right;overflow-y:auto;overflow-x:hidden;user-select:none;
}
.editor{
  overflow-y:auto;overflow-x:hidden;flex:1;background:#1e1e1e;color:#ddd;border:0;outline:0;
  padding:15px;font-size:14px;resize:none;line-height:1.5;
}
.progress{height:8px;background:#333;border-radius:4px;margin:10px 15px;overflow:hidden}
.bar{height:100%;width:0%;background:#00e676;transition:width 0.3s}
.status{text-align:center;color:#aaa;font-size:13px;margin:0 15px 5px}
.bottom{
  position:fixed;bottom:0;left:0;right:0;height:70px;
  background:#222;display:flex;align-items:center;gap:8px;padding:0 10px;z-index:10;
}
input{padding:12px;border-radius:8px;background:#333;color:#fff;border:0;flex:1}
#save{background:#3498DB}

.logBox{
  margin:12px 15px;
  min-height:180px;
  background:#000800;
  border:1px solid #222;
  border-radius:8px;
  padding:14px;
  color:#0f0;
  font-size:14px;
  white-space:pre-wrap;
  overflow-y:auto;overflow-x:hidden;
}
.logBox.error{
  color:#f55;
}
</style>
</head>

<body>
<div class="top">
<button class="btn" id="open">打开文件</button>
<button class="btn" id="clear">清空</button>
<select id="lang">
<option value="py">Python</option>
<option value="js">JavaScript</option>
<option value="lua">Lua</option>
<option value="java">Java</option>
<option value="go">Go</option>
<option value="php">PHP</option>
<option value="ruby">Ruby</option>
<option value="c">C语言</option>
</select>
<button class="btn" id="run">运行</button>
</div>

<div class="progress"><div class="bar" id="bar"></div></div>
<div class="status" id="status">准备就绪</div>

<div class="editorWrap">
  <div id="lines">1</div>
  <textarea class="editor" id="code"></textarea>
</div>

<div class="logBox" id="logBox"></div>

<div class="bottom">
<input id="name" value="test">
<select id="ext">
<option value=".html">HTML</option>
<option value=".js">JS</option>
<option value=".py">PY</option>
<option value=".lua">LUA</option>
<option value=".java">JAVA</option>
<option value=".go">GO</option>
<option value=".php">PHP</option>
<option value=".rb">RUBY</option>
<option value=".c">C</option>
<option value=".txt">TXT</option>
</select>
<button class="btn" id="save">保存文件</button>
</div>

<script>
// 全局DOM元素
const code = document.getElementById('code');
const logBox = document.getElementById('logBox');
const lang = document.getElementById('lang');
const bar = document.getElementById('bar');
const status = document.getElementById('status');
const lines = document.getElementById('lines');

// 全局解释器缓存
let pyodide = null;
let fengariState = null;

// 更新行号
function updateLines() {
  const count = code.value.split('\n').length;
  let html = '';
  for (let i = 1; i <= count; i++) html += i + '<br>';
  lines.innerHTML = html;
}
// 行号同步滚动
code.addEventListener('input', updateLines);
code.addEventListener('scroll', function(){
  lines.scrollTop = this.scrollTop;
});
updateLines();

// 进度条状态设置
function setProgress(p, text, color) {
  bar.style.width = p + '%';
  bar.style.background = color || '#00e676';
  status.textContent = text;
}

// 清空按钮
document.getElementById('clear').onclick = function() {
  code.value = '';
  logBox.textContent = '';
  logBox.className = 'logBox';
  updateLines();
  setProgress(0, '准备就绪');
};

// 打开本地文件
document.getElementById('open').onclick = function() {
  const input = document.createElement('input');
  input.type = 'file';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    setProgress(30, '加载文件...');
    const reader = new FileReader();
    reader.onload = () => {
      code.value = reader.result;
      updateLines();
      code.scrollTop = code.scrollHeight;
      lines.scrollTop = code.scrollTop;
      setProgress(100, '文件加载成功');
    };
    reader.readAsText(file);
  };
  input.click();
};

// 保存文件到本地
document.getElementById('save').onclick = function() {
  setProgress(40, '保存中...');
  const filename = document.getElementById('name').value || 'file';
  const ext = document.getElementById('ext').value;
  const blob = new Blob([code.value]);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename + ext;
  a.click();
  setProgress(100, '保存成功');
};

// 模拟错误信息
function getFakeErr(langName) {
  const errMap = {
    java: ["ClassNotFoundException", "缺少Main方法", "语法错误"],
    go: ["未定义变量", "包缺失", "语法错误"],
    php: ["解析错误", "未定义变量"],
    ruby: ["未定义方法", "语法异常"],
    c: ["段错误", "头文件缺失"]
  };
  const arr = errMap[langName] || ["未知语法错误"];
  return arr[Math.floor(Math.random() * arr.length)];
}

// 运行按钮核心逻辑
document.getElementById('run').onclick = async function() {
  logBox.textContent = '';
  logBox.className = 'logBox';
  const codeText = code.value.trim();
  if (!codeText) {
    setProgress(100, '❌ 代码为空', '#ff4444');
    logBox.textContent = "未输入任何代码，无法执行";
    logBox.classList.add("error");
    return;
  }

  // HTML 直接新窗口预览
  if (codeText.includes('<html') || document.getElementById('ext').value === '.html') {
    try {
      const win = window.open();
      win.document.write(codeText);
      setProgress(100, '✅ 页面已打开');
      logBox.textContent = "HTML页面已在新标签页打开";
      return;
    } catch (err) {
      setProgress(100, '❌ 浏览器弹窗拦截', '#ff4444');
      logBox.textContent = "浏览器阻止弹出窗口，请关闭拦截后重试";
      logBox.classList.add("error");
      return;
    }
  }

  // 进度动画
  const steps = ["初始化环境...", "解析代码...", "准备执行..."];
  let progressVal = 0;
  for (const step of steps) {
    progressVal += 30;
    if (progressVal > 90) progressVal = 90;
    setProgress(progressVal, step);
    await new Promise(r => setTimeout(r, 280));
  }

  // 按语言分支执行
  try {
    switch (lang.value) {
      case "js": {
        const oldLog = console.log;
        let output = "";
        console.log = (...args) => {
          output += args.join(" ") + "\n";
        };
        eval(codeText);
        console.log = oldLog;
        logBox.textContent = output || "JS执行完成，无输出";
        setProgress(100, "✅ JS运行成功");
        break;
      }
      case "py": {
        if (!pyodide) {
          setProgress(92, "正在加载Python解释器...");
          pyodide = await loadPyodide();
        }
        // 重定向print输出到日志框
        pyodide.runPython(`
import sys
from js import document
def custom_print(s):
    document.getElementById("logBox").textContent += str(s)
sys.stdout.write = custom_print
`);
        await pyodide.runPythonAsync(codeText);
        setProgress(100, "✅ Python运行成功");
        break;
      }
      case "lua": {
        if (!fengariState) {
          fengariState = fengari.lua.luaL_newstate();
          fengari.lua.luaL_openlibs(fengariState);
          // 重写print
          fengari.lua.lua_pushcfunction(fengariState, (L) => {
            const text = fengari.lua.lua_tostring(L, 1);
            logBox.textContent += text + "\n";
            return 0;
          });
          fengari.lua.lua_setglobal(fengariState, "print");
        }
        fengari.load(fengariState, codeText);
        fengari.lua.lua_pcall(fengariState, 0, 0, 0);
        setProgress(100, "✅ Lua运行成功");
        break;
      }
      // 其余语言模拟执行
      default: {
        if (Math.random() < 0.35) throw new Error(getFakeErr(lang.value));
        logBox.textContent = "模拟运行输出：\n" + codeText.slice(0, 300);
        setProgress(100, "⚠️ 模拟运行成功", "#ff9800");
        break;
      }
    }
  } catch (err) {
    setProgress(100, "❌ " + err.message, "#ff4444");
    logBox.textContent = `运行错误：\n${err.message}\n\n原因：语法错误/解释器异常`;
    logBox.classList.add("error");
  }
};
</script>
</body>
</html>
