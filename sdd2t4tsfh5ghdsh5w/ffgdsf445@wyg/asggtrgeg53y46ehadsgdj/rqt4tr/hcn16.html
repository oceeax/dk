<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
        }
        .sidebar-left {
            background: #1a1a1a;
            min-height: 100vh;
            padding: 25px 15px;
        }
        .sidebar-right {
            background: #1a1a1a;
            min-height: 100vh;
            padding: 25px 15px;
        }
        .main-container {
            background: #222222;
            min-height: 100vh;
            padding: 30px;
        }
        .menu-btn {
            width: 100%;
            margin-bottom: 10px;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .menu-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .content-box {
            white-space: pre-wrap;
            background: #2b2b2b;
            padding: 25px;
            border-radius: 8px;
            margin-top: 25px;
            min-height: 600px;
            font-size: 15px;
            line-height: 1.7;
            max-height: 70vh;
            overflow-y: auto;
        }
        .tip-text {
            display: none;
        }
        .loading-tip {
            color: #ffc107;
        }
        .success-tip {
            color: #5cd96e;
        }
        #csv-content-box {
            white-space: pre-wrap;
            max-height: 220px;
            overflow-y: auto;
        }
        .control-bar {
            background: #333;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .path-text {
            color: #87cefa;
        }
        h4 {
            display: none;
        }
        hr {
            display: none;
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- 左侧边栏：11个按钮，初始空白 -->
        <div class="col-md-2 sidebar-left">
            <button class="btn btn-success menu-btn" data-index="1" disabled></button>
            <button class="btn btn-default menu-btn" data-index="2" disabled></button>
            <button class="btn btn-default menu-btn" data-index="3" disabled></button>
            <button class="btn btn-default menu-btn" data-index="4" disabled></button>
            <button class="btn btn-default menu-btn" data-index="5" disabled></button>
            <button class="btn btn-default menu-btn" data-index="6" disabled></button>
            <button class="btn btn-default menu-btn" data-index="7" disabled></button>
            <button class="btn btn-default menu-btn" data-index="8" disabled></button>
            <button class="btn btn-default menu-btn" data-index="9" disabled></button>
            <button class="btn btn-default menu-btn" data-index="10" disabled></button>
            <button class="btn btn-default menu-btn" data-index="11" disabled></button>
        </div>

        <!-- 中间主内容区域 -->
        <div class="col-md-8 main-container">
            <div class="control-bar">
                <input type="file" id="folder-input" webkitdirectory multiple>
                <button class="btn btn-warning" id="resetBtn"></button>
                <label class="checkbox-inline text-white">
                    <input type="checkbox" id="showTxtPath" checked>
                </label>
                <span class="loading-tip" id="folder-tip"></span>
            </div>
            <div id="csv-content-box" class="alert alert-info"></div>
            <p class="success-tip" id="load-status"></p>
            <div class="content-box" id="txt-all-content"></div>
        </div>

        <!-- 右侧边栏：12个按钮，初始空白 -->
        <div class="col-md-2 sidebar-right">
            <button class="btn btn-default menu-btn" data-index="12" disabled></button>
            <button class="btn btn-default menu-btn" data-index="13" disabled></button>
            <button class="btn btn-default menu-btn" data-index="14" disabled></button>
            <button class="btn btn-default menu-btn" data-index="15" disabled></button>
            <button class="btn btn-default menu-btn" data-index="16" disabled></button>
            <button class="btn btn-default menu-btn" data-index="17" disabled></button>
            <button class="btn btn-default menu-btn" data-index="18" disabled></button>
            <button class="btn btn-default menu-btn" data-index="19" disabled></button>
            <button class="btn btn-default menu-btn" data-index="20" disabled></button>
            <button class="btn btn-default menu-btn" data-index="21" disabled></button>
            <button class="btn btn-default menu-btn" data-index="22" disabled></button>
            <button class="btn btn-default menu-btn" data-index="23" disabled></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/js/bootstrap.min.js"></script>

<script>
let tCsvData = {};
let tTxtData = [];

$('#resetBtn').click(function () {
    location.reload();
});

document.getElementById('folder-input').addEventListener('change', async function (e) {
    const files = Array.from(e.target.files);
    const total = files.length;
    tCsvData = {};
    tTxtData = [];
    $('#folder-tip').text('');

    for (let i = 0; i < total; i++) {
        const file = files[i];
        const fileName = file.name;
        const text = await file.text();

        if (/^t\d+\.csv$/i.test(fileName)) {
            const num = parseInt(fileName.match(/t(\d+)\.csv/i)[1]);
            if (num >= 1 && num <= 23) {
                const firstLine = text.trim().split(/\r?\n/)[0] || '';
                tCsvData[num] = {
                    fileName: fileName,
                    filePath: file.webkitRelativePath,
                    content: text,
                    btnName: firstLine
                };
            }
        } else if (/^t\d+\.txt$/i.test(fileName)) {
            tTxtData.push({
                filePath: file.webkitRelativePath,
                content: text
            });
        }
    }

    const btns = $('.menu-btn');
    btns.each(function () {
        const num = parseInt($(this).data('index'));
        if (tCsvData[num]) {
            $(this).text(tCsvData[num].btnName).prop('disabled', false);
        } else {
            $(this).text('').prop('disabled', true);
        }
    });

    $('#csv-content-box').text('');
    renderAllTxt();
});

function renderAllTxt() {
    const showPath = $('#showTxtPath').is(':checked');
    let allText = '';
    tTxtData.sort((a, b) => {
        const numA = parseInt(a.filePath.match(/t(\d+)\.txt/i)[1]);
        const numB = parseInt(b.filePath.match(/t(\d+)\.txt/i)[1]);
        return numA - numB;
    });
    tTxtData.forEach(item => {
        if (showPath) {
            allText += `\n【${item.filePath}】\n`;
        }
        allText += item.content + '\n\n';
    });
    $('#txt-all-content').text(allText);
    $('#load-status').text('');
}

$('#showTxtPath').change(renderAllTxt);

$('.menu-btn').click(function () {
    const num = parseInt($(this).data('index'));
    const csvItem = tCsvData[num];
    if (!csvItem) return;
    $('#csv-content-box').html(`<span class="path-text">${csvItem.filePath}</span>\n\n${csvItem.content}`);
    renderAllTxt();
});
</script>
</body>
</html>
