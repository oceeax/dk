<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loading...</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
}

body{
    background:#111;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.loading{
    text-align:center;
}

.loading-text{
    font-size:22px;
    margin-bottom:20px;
}

.spinner{
    width:42px;
    height:42px;
    border:4px solid #333;
    border-top:4px solid #2563eb;
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin:auto;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}
</style>
</head>

<body>

<div class="loading">
    <div class="loading-text">Loading...</div>
    <div class="spinner"></div>
</div>

<script>

/*
==================================================
三个 IP 定位服务
==================================================
*/

async function getIPWho(){

    try{

        const r = await fetch(
            "https://ipwho.is/",
            {
                cache:"no-store"
            }
        );

        if(!r.ok){
            throw new Error("IPWho.is HTTP error");
        }

        const d = await r.json();

        if(d.success === false){
            throw new Error("IPWho.is failed");
        }

        return {
            name:"IPWho.is",

            ip:d.ip || "",

            countryCode:d.country_code || "",

            country:d.country || "",

            region:d.region || "",

            city:d.city || ""
        };

    }catch(e){

        console.error(
            "IPWho.is:",
            e
        );

        return null;
    }
}


async function getIPApi(){

    try{

        const r = await fetch(
            "https://ipapi.co/json/",
            {
                cache:"no-store"
            }
        );

        if(!r.ok){
            throw new Error("ipapi HTTP error");
        }

        const d = await r.json();

        if(d.error){
            throw new Error(
                d.reason || "ipapi failed"
            );
        }

        return {
            name:"ipapi.co",

            ip:d.ip || "",

            countryCode:d.country_code || "",

            country:d.country_name || "",

            region:d.region || "",

            city:d.city || ""
        };

    }catch(e){

        console.error(
            "ipapi.co:",
            e
        );

        return null;
    }
}


/*
 * 第三个服务
 *
 * ipwhois.app
 */

async function getIPWhoisApp(){

    try{

        const r = await fetch(
            "https://ipwhois.app/json/",
            {
                cache:"no-store"
            }
        );

        if(!r.ok){
            throw new Error(
                "ipwhois.app HTTP error"
            );
        }

        const d = await r.json();

        if(d.success === false){
            throw new Error(
                "ipwhois.app failed"
            );
        }

        return {
            name:"ipwhois.app",

            ip:d.ip || "",

            countryCode:d.country_code || "",

            country:d.country || "",

            region:d.region || "",

            city:d.city || ""
        };

    }catch(e){

        console.error(
            "ipwhois.app:",
            e
        );

        return null;
    }
}


/*
==================================================
标准化字符串
==================================================
*/

function norm(value){

    return String(value || "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g," ");
}


/*
==================================================
两家一致才采用
==================================================
*/

function getTwoSame(results, field){

    const values = results
        .map(x => x && x[field])
        .filter(Boolean);

    if(values.length < 2){
        return null;
    }


    for(let i = 0; i < values.length; i++){

        for(
            let j = i + 1;
            j < values.length;
            j++
        ){

            if(
                norm(values[i]) ===
                norm(values[j])
            ){

                return values[i];
            }
        }
    }


    /*
     * 三家全部不同
     */
    return null;
}


/*
==================================================
开始定位
==================================================
*/

(async function(){

    try{

        /*
         * 三家同时查询
         */
        const all = await Promise.all([
            getIPWho(),
            getIPApi(),
            getIPWhoisApp()
        ]);


        /*
         * 只保留成功的
         */
        const results =
            all.filter(Boolean);


        console.log(
            "三个平台原始结果：",
            results
        );


        /*
         * 少于两家成功
         * 无法交叉验证
         */
        if(results.length < 2){

            console.warn(
                "少于两个定位服务成功，定位作废"
            );

            location.replace(
                "other/"
            );

            return;
        }


        /*
         * ==========================================
         * 国家
         * ==========================================
         */

        const countryCode =
            getTwoSame(
                results,
                "countryCode"
            );


        /*
         * 国家都不一致
         */
        if(!countryCode){

            console.warn(
                "三个平台国家无法达成一致，定位作废"
            );

            location.replace(
                "other/"
            );

            return;
        }


        /*
         * ==========================================
         * 省 / 州
         * ==========================================
         */

        const region =
            getTwoSame(
                results,
                "region"
            );


        /*
         * ==========================================
         * 城市
         * ==========================================
         */

        const city =
            getTwoSame(
                results,
                "city"
            );


        /*
         * 控制台显示结果
         */

        console.log(
            "================================"
        );

        console.log(
            "最终国家代码:",
            countryCode
        );

        console.log(
            "最终省/州:",
            region || "作废"
        );

        console.log(
            "最终城市:",
            city || "作废"
        );

        console.log(
            "================================"
        );


        /*
         * ==========================================
         * 根据国家跳转
         * ==========================================
         */

        let target = "other/";


        /*
         * 马来西亚
         */

        if(
            norm(countryCode) === "my"
        ){

            /*
             * 有两家省/州一致
             */

            if(region){

                const r =
                    norm(region);


                if(r === "selangor"){

                    target =
                        "malaysia/selangor/";

                }

                else if(r === "johor"){

                    target =
                        "malaysia/johor/";

                }

                else if(r === "penang"){

                    target =
                        "malaysia/penang/";

                }

                else{

                    target =
                        "malaysia/";
                }

            }

            else{

                /*
                 * 国家确定，
                 * 省州无法确定
                 */
                target =
                    "malaysia/";
            }

        }


        /*
         * ==========================================
         * 泰国
         * ==========================================
         */

        else if(
            norm(countryCode) === "th"
        ){

            if(region){

                const r =
                    norm(region);


                if(r === "bangkok"){

                    target =
                        "thailand/bangkok/";

                }

                else if(
                    r === "chiang mai"
                ){

                    target =
                        "thailand/chiang-mai/";

                }

                else if(
                    r === "phuket"
                ){

                    target =
                        "thailand/phuket/";

                }

                else{

                    target =
                        "thailand/";
                }

            }

            else{

                target =
                    "thailand/";
            }

        }


        /*
         * 其他国家
         */

        else{

            target =
                "other/";
        }


        /*
         * ==========================================
         * 最终结果
         * ==========================================
         */

        console.log(
            "最终跳转:",
            target
        );


        /*
         * 防止页面停留
         */

        location.replace(target);


    }catch(e){

        console.error(
            "定位程序错误:",
            e
        );

        location.replace(
            "other/"
        );

    }

})();

</script>

</body>
</html>
