<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
        }
        .sidebar-left {
            background: #1a1a1a;
            min-height: 100vh;
            padding: 25px 15px;
        }
        .sidebar-right {
            background: #1a1a1a;
            min-height: 100vh;
            padding: 25px 15px;
        }
        .main-container {
            background: #222222;
            min-height: 100vh;
            padding: 30px;
        }
        .menu-btn {
            width: 100%;
            margin-bottom: 10px;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .menu-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .content-box {
            white-space: pre-wrap;
            background: #2b2b2b;
            padding: 25px;
            border-radius: 8px;
            margin-top: 25px;
            min-height: 600px;
            font-size: 15px;
            line-height: 1.7;
            max-height: 70vh;
            overflow-y: auto;
        }
        h4, hr, .tip-text, #folder-tip, .control-bar {
            display: none;
        }
        #csv-content-box {
            white-space: pre-wrap;
            max-height: 220px;
            overflow-y: auto;
            background: #333;
            padding:15px;
            border-radius:6px;
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- 左侧11个按钮 1~11 -->
        <div class="col-md-2 sidebar-left">
            <button class="btn btn-success menu-btn" data-num="1" disabled></button>
            <button class="btn btn-default menu-btn" data-num="2" disabled></button>
            <button class="btn btn-default menu-btn" data-num="3" disabled></button>
            <button class="btn btn-default menu-btn" data-num="4" disabled></button>
            <button class="btn btn-default menu-btn" data-num="5" disabled></button>
            <button class="btn btn-default menu-btn" data-num="6" disabled></button>
            <button class="btn btn-default menu-btn" data-num="7" disabled></button>
            <button class="btn btn-default menu-btn" data-num="8" disabled></button>
            <button class="btn btn-default menu-btn" data-num="9" disabled></button>
            <button class="btn btn-default menu-btn" data-num="10" disabled></button>
            <button class="btn btn-default menu-btn" data-num="11" disabled></button>
        </div>

        <!-- 中间内容区域 -->
        <div class="col-md-8 main-container">
            <div id="csv-content-box"></div>
            <div id="txt-all-content" class="content-box"></div>
        </div>

        <!-- 右侧12个按钮 12~23 -->
        <div class="col-md-2 sidebar-right">
            <button class="btn btn-default menu-btn" data-num="12" disabled></button>
            <button class="btn btn-default menu-btn" data-num="13" disabled></button>
            <button class="btn btn-default menu-btn" data-num="14" disabled></button>
            <button class="btn btn-default menu-btn" data-num="15" disabled></button>
            <button class="btn btn-default menu-btn" data-num="16" disabled></button>
            <button class="btn btn-default menu-btn" data-num="17" disabled></button>
            <button class="btn btn-default menu-btn" data-num="18" disabled></button>
            <button class="btn btn-default menu-btn" data-num="19" disabled></button>
            <button class="btn btn-default menu-btn" data-num="20" disabled></button>
            <button class="btn btn-default menu-btn" data-num="21" disabled></button>
            <button class="btn btn-default menu-btn" data-num="22" disabled></button>
            <button class="btn btn-default menu-btn" data-num="23" disabled></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/js/bootstrap.min.js"></script>

<script>
// =====================【只改这里一个字母即可切换系列】=====================
const PREFIX = "a";  
// 改这里：a / b / t / y
// 自动对应加载压缩包： a_data.zip  / b_data.zip / t_data.zip / y_data.zip
// =======================================================================

const csvMap = {};
const txtMap = {};
let allTxtMerge = "";

// 根据前缀自动生成压缩包名称
const ZIP_NAME = `${PREFIX}_data.zip`;

// 加载并解压对应系列的独立压缩包
async function loadAndUnzip(zipUrl) {
    const res = await fetch(zipUrl, { cache: "no-cache" });
    const blob = await res.blob();
    return await JSZip.loadAsync(blob);
}

async function initLoadZip() {
    // 清空上一组数据
    Object.keys(csvMap).forEach(k => delete csvMap[k]);
    Object.keys(txtMap).forEach(k => delete txtMap[k]);
    allTxtMerge = "";
    $("#csv-content-box").text("");
    $("#txt-all-content").text("");
    $(".menu-btn").text("").prop("disabled", true);

    try {
        const zip = await loadAndUnzip(ZIP_NAME);
        const csvReadPromises = [];
        const txtReadPromises = [];

        // 动态正则匹配当前系列文件：a1.csv、b1.csv
        const csvReg = new RegExp(`^${PREFIX}(\\d+)\\.csv$`, 'i');
        const txtReg = new RegExp(`^${PREFIX}(\\d+)\\.txt$`, 'i');

        zip.forEach((relativePath, entry) => {
            if (entry.dir) return;

            // 匹配当前系列 CSV
            const csvMatch = relativePath.match(csvReg);
            if (csvMatch) {
                const num = parseInt(csvMatch[1]);
                const p = entry.async("string").then(text => {
                    csvMap[num] = text;
                    const firstLine = text.trim().split(/\r?\n/)[0] || "";
                    $(`.menu-btn[data-num="${num}"]`).text(firstLine).prop("disabled", false);
                });
                csvReadPromises.push(p);
            }

            // 匹配当前系列 TXT
            const txtMatch = relativePath.match(txtReg);
            if (txtMatch) {
                const num = parseInt(txtMatch[1]);
                const p = entry.async("string").then(text => {
                    txtMap[num] = text;
                });
                txtReadPromises.push(p);
            }
        });

        await Promise.all(csvReadPromises);
        await Promise.all(txtReadPromises);

        // 按顺序拼接当前系列所有txt
        allTxtMerge = "";
        for (let i = 1; i <= 50; i++) {
            if (txtMap[i]) allTxtMerge += txtMap[i] + "\n\n";
        }
        $("#txt-all-content").text(allTxtMerge);

    } catch (err) {
        console.error(`${ZIP_NAME} 加载失败：`, err);
    }
}

// 按钮点击查看对应CSV内容
$(".menu-btn").click(function () {
    const num = $(this).data("num");
    if (!csvMap[num]) return;
    $("#csv-content-box").text(csvMap[num]);
    $("#txt-all-content").text(allTxtMerge);
});

$(document).ready(initLoadZip);
</script>
</body>
</html>
