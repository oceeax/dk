<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>正在检测IP信息</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body{
    background:#111;
    color:#fff;
    min-height:100vh;
    padding:25px;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.container{
    max-width:760px;
    margin:auto;
}
.title{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    margin-bottom:25px;
}
.card{
    background:#1b1b1b;
    border-radius:14px;
    padding:20px;
    margin-bottom:18px;
}
.card h2{
    font-size:20px;
    margin-bottom:15px;
}
.row{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:10px 0;
    border-bottom:1px solid #333;
}
.row:last-child{
    border-bottom:none;
}
.label{
    color:#999;
    flex-shrink:0;
}
.value{
    text-align:right;
    word-break:break-all;
}
.api{
    background:#151515;
    border-radius:10px;
    padding:15px;
    margin-top:12px;
    line-height:1.8;
}
.api-title{
    font-size:17px;
    font-weight:bold;
    margin-bottom:5px;
}
.ok{
    color:#4ade80;
}
.fail{
    color:#f87171;
}
.wait{
    color:#aaa;
}
.process-tip{
    color:#ffcc44;
    margin:8px 0;
}
.countdown{
    text-align:center;
    margin-top:25px;
    display:none;
}
.number{
    font-size:52px;
    font-weight:bold;
}
.text{
    color:#999;
}
.tip-small{
    font-size:14px;
    color:#bbbbbb;
    margin-top:6px;
}
</style>
</head>
<body>
<div class="container">
    <div class="title">正在检测访问者IP信息</div>
    <!-- IP基础信息（test-ipv6获取） -->
    <div class="card">
        <h2>本机公网 IP</h2>
        <div class="process-tip" id="ipProcessTip">正在等待test-ipv6获取公网IP（最长20秒）</div>
        <div class="tip-small" id="ipBackupTip"></div>
        <div class="row">
            <span class="label">IP地址</span>
            <span class="value" id="mainIP">查询中...</span>
        </div>
        <div class="row">
            <span class="label">IP协议</span>
            <span class="value" id="ipVersion">检测中...</span>
        </div>
    </div>
    <!-- 4个独立免费IP库查询结果 -->
    <div class="card">
        <h2>4个独立IP库查询结果</h2>
        <div class="process-tip" id="apiProcessTip">等待公网IP获取完成后启动查询</div>
        <div id="apiBox">
            <div class="wait">未开始查询</div>
        </div>
    </div>
    <!-- 综合判定定位结果 -->
    <div class="card">
        <h2>综合判定定位结果</h2>
        <div class="row">
            <span class="label">国家</span>
            <span class="value" id="country">检测中...</span>
        </div>
        <div class="row">
            <span class="label">省份</span>
            <span class="value" id="region">检测中...</span>
        </div>
        <div class="row">
            <span class="label">城市</span>
            <span class="value" id="city">检测中...</span>
        </div>
        <div class="row">
            <span class="label">区县</span>
            <span class="value" id="area">检测中...</span>
        </div>
        <div class="row">
            <span class="label">运营商</span>
            <span class="value" id="isp">检测中...</span>
        </div>
    </div>
    <!-- 倒计时跳转（全部查询完成才显示） -->
    <div class="countdown" id="countWrap">
        <div class="number" id="num">5</div>
        <div class="text">秒后自动进入主页</div>
    </div>
</div>

<script>
// 方案1：test-ipv6 JSONP 获取IP（本地content://协议容易拦截）
function getIPByJsonp() {
    return new Promise((resolve) => {
        const cbName = "testIpCallback_" + Date.now();
        let script = document.createElement("script");
        // 同时加载ipv4+ipv6双节点
        window[cbName] = function(res) {
            document.body.removeChild(script);
            delete window[cbName];
            if(res.ipinfo?.ip) resolve(res.ipinfo.ip);
        }
        // 优先ipv4，备用ipv6节点
        script.src = `https://ipv4.lookup.test-ipv6.com/ip/?callback=${cbName}&asn=1`;
        document.body.appendChild(script);
        // 20秒超时
        setTimeout(()=>{
            try{document.body.removeChild(script);}catch(e){}
            delete window[cbName];
            resolve(null);
        },20000);
    })
}

// 方案2：备用fetch接口，无JSONP，不受本地文件跨域拦截（兜底）
async function getIPByFetchBackup(){
    const list = [
        "https://api.ipify.org?format=json",
        "https://icanhazip.com",
        "https://api.ip.sb/ip"
    ];
    for(let url of list){
        try{
            const res = await fetch(url,{cache:"no-cache",signal:AbortSignal.timeout(8000)});
            let text = await res.text();
            text = text.trim();
            if(url.includes("ipify")){
                const j = JSON.parse(text);
                return j.ip;
            }else{
                if(text.length < 50) return text;
            }
        }catch(e){continue;}
    }
    return null;
}

// 双方案获取IP：先JSONP，失败自动切fetch备用
async function getPublicIPAll(){
    const tipDom = document.getElementById("ipBackupTip");
    let ip = await getIPByJsonp();
    if(ip){
        tipDom.innerText = "✅ 通过test-ipv6 JSONP成功获取IP";
        return ip;
    }
    tipDom.innerText = "⚠️ test-ipv6 JSONP被本地浏览器拦截，切换备用接口获取IP";
    ip = await getIPByFetchBackup();
    return ip;
}

// 2. 4套独立定位接口，单个请求超时20秒
const apiList = [
    {
        name: "ip9国内IP库",
        url: ip => `https://ip9.com.cn/get?ip=${ip}`,
        parser: res => {
            if(res.ret !== 200) return null;
            const d = res.data;
            return {
                source: "ip9国内IP库",
                ip: d.ip,
                country: d.country,
                region: d.prov,
                city: d.city,
                area: d.area,
                isp: d.isp
            }
        }
    },
    {
        name: "api.ip.sb全球库",
        url: ip => `https://api.ip.sb/geoip/${ip}`,
        parser: res => {
            return {
                source: "api.ip.sb全球库",
                ip: res.ip,
                country: res.country,
                region: res.region,
                city: res.city,
                area: "",
                isp: res.organization
            }
        }
    },
    {
        name: "vore免费IP库",
        url: ip => `https://api.vore.top/api/IPdata?ip=${ip}`,
        parser: res => {
            if(res.code !== 200) return null;
            return {
                source: "vore免费IP库",
                ip: res.ip,
                country: res.country,
                region: res.province,
                city: res.city,
                area: res.area,
                isp: res.isp
            }
        }
    },
    {
        name: "uaip查询库",
        url: ip => `https://ip.useragentinfo.com/json?ip=${ip}`,
        parser: res => {
            if(res.code !== 200) return null;
            return {
                source: "uaip查询库",
                ip: res.ip,
                country: res.country,
                region: res.province,
                city: res.city,
                area: res.area,
                isp: res.isp
            }
        }
    }
];

// 文本标准化比对
function normalize(value) {
    return String(value || "").trim().replace(/\s+/g, "");
}
// 多源共识判定
function getConsensusResult(results, fieldKey) {
    const map = {};
    results.forEach(item => {
        const val = normalize(item[fieldKey]);
        if (!val) return;
        if (!map[val]) map[val] = [];
        map[val].push(item);
    });
    let target = null;
    for (const key in map) {
        if (map[key].length >= 2) {
            target = map[key][0][fieldKey];
            break;
        }
    }
    return target;
}

// 渲染4个接口面板
function renderApiPanel(results) {
    const box = document.getElementById("apiBox");
    box.innerHTML = "";
    apiList.forEach(api => {
        const matchData = results.find(r => r.source === api.name);
        const div = document.createElement("div");
        div.className = "api";
        if (!matchData) {
            div.innerHTML = `
                <div class="api-title fail">${api.name}</div>
                <div>接口请求失败/超时无数据</div>
            `;
        } else {
            div.innerHTML = `
                <div class="api-title ok">${matchData.source}</div>
                <div>IP：${matchData.ip}</div>
                <div>省份：${matchData.region || "未知"}</div>
                <div>城市：${matchData.city || "未知"}</div>
                <div>区县：${matchData.area || "无"}</div>
                <div>运营商：${matchData.isp || "未知"}</div>
            `;
        }
        box.appendChild(div);
    })
}

// 串行逐个查询4个接口，单个超时20秒，实时更新进度提示
async function fetchSerialAllApi(ip) {
    const successList = [];
    const apiTip = document.getElementById("apiProcessTip");
    for(let i = 0; i < apiList.length; i++) {
        const api = apiList[i];
        apiTip.innerText = `正在查询第${i+1}/4个库：${api.name}（单接口最长20秒）`;
        try {
            const res = await fetch(api.url(ip), { 
                cache: "no-cache", 
                signal: AbortSignal.timeout(20000) 
            });
            const json = await res.json();
            const parseData = api.parser(json);
            if (parseData && parseData.ip) successList.push(parseData);
        } catch (e) {
            console.log(`${api.name} 请求超时/失败`, e);
        }
    }
    apiTip.innerText = "4个IP库全部查询完成";
    return successList;
}

// 统一填充空定位结果
function fillEmptyResult() {
    document.getElementById("country").textContent = "无法确定";
    document.getElementById("region").textContent = "无法确定";
    document.getElementById("city").textContent = "无法确定";
    document.getElementById("area").textContent = "无法确定";
    document.getElementById("isp").textContent = "无法确定";
}

// 页面主逻辑
async function main() {
    const apiBox = document.getElementById("apiBox");
    const ipTip = document.getElementById("ipProcessTip");
    const apiTip = document.getElementById("apiProcessTip");
    const countWrap = document.getElementById("countWrap");
    try{
        // 第一步：双方案获取公网IP，最长等待20秒
        const publicIP = await getPublicIPAll();
        if(!publicIP) throw new Error("所有IP获取接口全部超时失败");
        ipTip.innerText = "公网IP获取成功";
        document.getElementById("mainIP").textContent = publicIP;
        const ipVer = publicIP.includes(":") ? "IPv6" : "IPv4";
        document.getElementById("ipVersion").textContent = ipVer;

        // 第二步：串行查询4个定位接口，逐个执行，全部完成再下一步
        const resultList = await fetchSerialAllApi(publicIP);
        if (resultList.length === 0) {
            apiBox.innerHTML = `<div class="fail">所有定位接口全部请求失败</div>`;
            fillEmptyResult();
        }else{
            renderApiPanel(resultList);
            // 多源比对字段
            const countryRes = getConsensusResult(resultList, "country");
            const regionRes = getConsensusResult(resultList, "region");
            const cityRes = getConsensusResult(resultList, "city");
            const areaRes = getConsensusResult(resultList, "area");
            const ispRes = getConsensusResult(resultList, "isp");

            document.getElementById("country").textContent = countryRes || "定位失效（无2条一致数据）";
            document.getElementById("region").textContent = regionRes || "定位失效（无2条一致数据）";
            document.getElementById("city").textContent = cityRes || "定位失效（无2条一致数据）";
            document.getElementById("area").textContent = areaRes || "无匹配区县";
            document.getElementById("isp").textContent = ispRes || "定位失效（无2条一致数据）";

            // 存储定位数据
            sessionStorage.setItem("geoResult", JSON.stringify({
                ip: publicIP,
                ipVersion: ipVer,
                country: countryRes || "",
                region: regionRes || "",
                city: cityRes || "",
                area: areaRes || "",
                isp: ispRes || ""
            }));
        }
        // 全部查询完成，显示倒计时跳转
        countWrap.style.display = "block";
        let time = 5;
        const numDom = document.getElementById("num");
        const timer = setInterval(() => {
            time--;
            numDom.textContent = time;
            if (time <= 0) {
                clearInterval(timer);
                location.href = "home/";
            }
        }, 1000);
    }catch(e){
        console.error("全局流程异常：",e);
        ipTip.innerText = "全部IP获取渠道20秒超时失败";
        apiTip.innerText = "未执行定位查询";
        apiBox.innerHTML = `<div class="fail">IP获取失败，终止后续查询</div>`;
        document.getElementById("mainIP").textContent = "获取失败";
        document.getElementById("ipVersion").textContent = "未知";
        fillEmptyResult();
    }
}

main();
</script>
</body>
</html>
