<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>多层文件夹批量文件加载系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
        }
        .sidebar-left {
            background: #1a1a1a;
            min-height: 100vh;
            padding: 25px 15px;
        }
        .sidebar-right {
            background: #1a1a1a;
            min-height: 100vh;
            padding: 25px 15px;
        }
        .main-container {
            background: #222222;
            min-height: 100vh;
            padding: 30px;
        }
        .menu-btn {
            width: 100%;
            margin-bottom: 10px;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .content-box {
            white-space: pre-wrap;
            background: #2b2b2b;
            padding: 25px;
            border-radius: 8px;
            margin-top: 25px;
            min-height: 600px;
            font-size: 15px;
            line-height: 1.7;
        }
        .tip-text {
            color: #aaaaaa;
            font-size: 13px;
            margin-top: 20px;
        }
        .loading-tip {
            color: #ffc107;
        }
        #csv-content-box {
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
        }
        .upload-tip-box {
            background: #333;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- 左侧边栏：11个按钮 -->
        <div class="col-md-2 sidebar-left">
            <h4 class="text-center mb-4">左侧菜单（11项）</h4>
            <hr>
            <button class="btn btn-success menu-btn" data-index="0">等待加载CSV</button>
            <button class="btn btn-default menu-btn" data-index="1">等待加载CSV</button>
            <button class="btn btn-default menu-btn" data-index="2">等待加载CSV</button>
            <button class="btn btn-default menu-btn" data-index="3">等待加载CSV</button>
            <button class="btn btn-default menu-btn" data-index="4">等待加载CSV</button>
            <button class="btn btn-default menu-btn" data-index="5">等待加载CSV</button>
            <button class="btn btn-default menu-btn" data-index="6">等待加载CSV</button>
            <button class="btn btn-default menu-btn" data-index="7">等待加载CSV</button>
            <button class="btn btn-default menu-btn" data-index="8">等待加载CSV</button>
            <button class="btn btn-default menu-btn" data-index="9">等待加载CSV</button>
            <button class="btn btn-default menu-btn" data-index="10">等待加载CSV</button>

            <div class="tip-text">
                <p>先点击中间【选择文件夹】<br>授权后自动遍历所有层级子目录</p>
            </div>
        </div>

        <!-- 中间主内容区域 -->
        <div class="col-md-8 main-container">
            <div class="upload-tip-box">
                <input type="file" id="folder-input" webkitdirectory multiple>
                <span class="loading-tip" id="folder-tip">请选择存放CSV、TXT的根文件夹（会自动扫描所有层级子文件夹）</span>
            </div>
            <div id="csv-content-box" class="alert alert-info"></div>
            <p class="loading-tip" id="load-status"></p>
            <div class="content-box" id="txt-all-content"></div>
        </div>

        <!-- 右侧边栏：12个按钮 -->
        <div class="col-md-2 sidebar-right">
            <h4 class="text-center mb-4">右侧菜单（12项）</h4>
            <hr>
            <button class="btn btn-default menu-btn" data-index="11">等待加载CSV</button>
            <button class="btn btn-default menu-btn" data-index="12">等待加载CSV</button>
            <button class="btn btn-default menu-btn" data-index="13">等待加载CSV</button>
            <button class="btn btn-default menu-btn" data-index="14">等待加载CSV</button>
            <button class="btn btn-default menu-btn" data-index="15">等待加载CSV</button>
            <button class="btn btn-default menu-btn" data-index="16">等待加载CSV</button>
            <button class="btn btn-default menu-btn" data-index="17">等待加载CSV</button>
            <button class="btn btn-default menu-btn" data-index="18">等待加载CSV</button>
            <button class="btn btn-default menu-btn" data-index="19">等待加载CSV</button>
            <button class="btn btn-default menu-btn" data-index="20">等待加载CSV</button>
            <button class="btn btn-default menu-btn" data-index="21">等待加载CSV</button>
            <button class="btn btn-default menu-btn" data-index="22">等待加载CSV</button>

            <div class="tip-text">
                <p>总共23个菜单按钮<br>自动读取所有子文件夹内CSV</p>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/js/bootstrap.min.js"></script>

<script>
// 全局存储文件数据
let csvFileList = [];
let txtAllContent = "";

// 文件夹选择监听
document.getElementById('folder-input').addEventListener('change', async function (e) {
    const files = Array.from(e.target.files);
    $('#folder-tip').text(`已选中文件夹，开始遍历所有层级子目录，共检测到${files.length}个文件...`);
    csvFileList = [];
    txtAllContent = "";

    // 1. 遍历所有文件，分类收集CSV、TXT
    for (const file of files) {
        const fileName = file.name.toLowerCase();
        // 读取文件文本
        const text = await file.text();
        if (fileName.endsWith('.csv')) {
            csvFileList.push({
                name: file.name,
                path: file.webkitRelativePath,
                content: text,
                firstLine: text.trim().split(/\r?\n/)[0] || '未命名'
            });
        } else if (fileName.endsWith('.txt')) {
            // 拼接所有txt内容，不保存文件名
            txtAllContent += text + '\n\n';
        }
    }

    // 最多只取前23个CSV匹配23个按钮
    csvFileList = csvFileList.slice(0, 23);
    const btnList = $('.menu-btn');
    btnList.each(function (idx) {
        if (csvFileList[idx]) {
            $(this).text(csvFileList[idx].firstLine);
        } else {
            $(this).text('暂无CSV文件');
        }
    });

    $('#folder-tip').text(`扫描完成！成功读取${csvFileList.length}个CSV文件、所有TXT文本已缓存，点击左侧/右侧按钮查看内容`);
    $('#load-status').text('');
    $('#csv-content-box').text('请点击侧边菜单按钮查看对应CSV详情');
    $('#txt-all-content').text(txtAllContent);
});

// 按钮点击事件
$('.menu-btn').click(function () {
    const idx = parseInt($(this).data('index'));
    if (!csvFileList[idx]) {
        $('#csv-content-box').text('当前位置暂无匹配的CSV文件，请重新选择文件夹');
        return;
    }
    // 展示当前CSV完整内容
    $('#csv-content-box').text(`文件路径：${csvFileList[idx].path}\n\n${csvFileList[idx].content}`);
    $('#load-status').text('所有层级文件夹内TXT内容已全部加载完成');
    $('#txt-all-content').text(txtAllContent);
});
</script>
</body>
</html>
