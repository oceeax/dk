<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ZIP文档阅读器</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
        }
        .sidebar-left {
            background: #1a1a1a;
            min-height: 100vh;
            padding: 25px 15px;
        }
        .sidebar-right {
            background: #1a1a1a;
            min-height: 100vh;
            padding: 25px 15px;
        }
        .main-container {
            background: #222222;
            min-height: 100vh;
            padding: 30px;
        }
        .menu-btn {
            width: 100%;
            margin-bottom: 10px;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .menu-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .menu-btn.active {
            background: #28a745;
            color: #fff;
            border-color: #28a745;
        }
        .content-box {
            white-space: pre-wrap;
            background: #2b2b2b;
            padding: 25px;
            border-radius: 8px;
            margin-top: 25px;
            min-height: 600px;
            font-size: 15px;
            line-height: 1.7;
            max-height: 70vh;
            overflow-y: auto;
        }
        #csv-content-box {
            white-space: pre-wrap;
            max-height: 220px;
            overflow-y: auto;
            background: #333;
            padding:15px;
            border-radius:6px;
        }
        .upload-bar {
            margin-bottom: 20px;
            padding:15px;
            background:#2b2b2b;
            border-radius:8px;
        }
        .tip {
            color:#aaa;
            margin-top:10px;
        }
        /* 移动端适配 */
        @media (max-width: 992px) {
            .sidebar-left,.sidebar-right {
                min-height: auto;
                padding:15px;
            }
            .main-container {
                padding:15px;
            }
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <!-- 顶部上传栏 -->
    <div class="row upload-bar">
        <div class="col-md-12">
            <label class="btn btn-primary">
                上传 zip 压缩包
                <input type="file" id="zip-file-input" accept=".zip" style="display:none">
            </label>
            <span class="tip">支持 a_data.zip / b_data.zip / t_data.zip / y_data.zip 格式</span>
            <div class="form-inline" style="margin-top:10px;">
                <label>系列前缀：</label>
                <input type="text" id="prefix-input" value="a" class="form-control" style="width:80px">
                <span class="text-muted">（用于匹配 a1.csv、a1.txt 这类文件）</span>
            </div>
        </div>
    </div>

    <div class="row">
        <!-- 左侧按钮 1~11 -->
        <div class="col-md-2 sidebar-left">
            <button class="btn btn-default menu-btn" data-num="1" disabled></button>
            <button class="btn btn-default menu-btn" data-num="2" disabled></button>
            <button class="btn btn-default menu-btn" data-num="3" disabled></button>
            <button class="btn btn-default menu-btn" data-num="4" disabled></button>
            <button class="btn btn-default menu-btn" data-num="5" disabled></button>
            <button class="btn btn-default menu-btn" data-num="6" disabled></button>
            <button class="btn btn-default menu-btn" data-num="7" disabled></button>
            <button class="btn btn-default menu-btn" data-num="8" disabled></button>
            <button class="btn btn-default menu-btn" data-num="9" disabled></button>
            <button class="btn btn-default menu-btn" data-num="10" disabled></button>
            <button class="btn btn-default menu-btn" data-num="11" disabled></button>
        </div>

        <!-- 中间内容区域 -->
        <div class="col-md-8 main-container">
            <div id="csv-content-box">请上传 zip 文件后加载数据</div>
            <div id="txt-all-content" class="content-box"></div>
        </div>

        <!-- 右侧按钮 12~23 -->
        <div class="col-md-2 sidebar-right">
            <button class="btn btn-default menu-btn" data-num="12" disabled></button>
            <button class="btn btn-default menu-btn" data-num="13" disabled></button>
            <button class="btn btn-default menu-btn" data-num="14" disabled></button>
            <button class="btn btn-default menu-btn" data-num="15" disabled></button>
            <button class="btn btn-default menu-btn" data-num="16" disabled></button>
            <button class="btn btn-default menu-btn" data-num="17" disabled></button>
            <button class="btn btn-default menu-btn" data-num="18" disabled></button>
            <button class="btn btn-default menu-btn" data-num="19" disabled></button>
            <button class="btn btn-default menu-btn" data-num="20" disabled></button>
            <button class="btn btn-default menu-btn" data-num="21" disabled></button>
            <button class="btn btn-default menu-btn" data-num="22" disabled></button>
            <button class="btn btn-default menu-btn" data-num="23" disabled></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/js/bootstrap.min.js"></script>

<script>
let csvMap = {};
let txtMap = {};
let allTxtMerge = "";
let currentPrefix = "a";

// 重置界面状态
function resetUI() {
    csvMap = {};
    txtMap = {};
    allTxtMerge = "";
    $("#csv-content-box").text("");
    $("#txt-all-content").text("");
    $(".menu-btn").text("").prop("disabled", true).removeClass("active");
}

// 解析zip文件
async function parseZip(zipBlob) {
    resetUI();
    currentPrefix = $("#prefix-input").val().trim() || "a";
    const zip = await JSZip.loadAsync(zipBlob);

    const csvPromises = [];
    const txtPromises = [];

    // 构建匹配正则：前缀+数字.csv / .txt
    const regCsv = new RegExp(`^${currentPrefix}(\\d+)\\.csv$`, 'i');
    const regTxt = new RegExp(`^${currentPrefix}(\\d+)\\.txt$`, 'i');

    zip.forEach((path, entry) => {
        if (entry.dir) return;
        const fileName = path.toLowerCase();

        // 匹配CSV
        const csvMatch = fileName.match(regCsv);
        if (csvMatch) {
            const num = parseInt(csvMatch[1]);
            csvPromises.push(
                entry.async("string").then(text => {
                    csvMap[num] = text;
                    const firstLine = text.trim().split(/\r?\n/)[0] || `文件${num}`;
                    $(`.menu-btn[data-num="${num}"]`).text(firstLine).prop("disabled", false);
                })
            );
        }

        // 匹配TXT
        const txtMatch = fileName.match(regTxt);
        if (txtMatch) {
            const num = parseInt(txtMatch[1]);
            txtPromises.push(
                entry.async("string").then(text => {
                    txtMap[num] = text;
                })
            );
        }
    });

    await Promise.all(csvPromises);
    await Promise.all(txtPromises);

    // 按1~23顺序合并txt内容
    allTxtMerge = "";
    for (let i = 1; i <= 23; i++) {
        if (txtMap[i]) allTxtMerge += txtMap[i] + "\n\n";
    }
    $("#txt-all-content").text(allTxtMerge);
}

// 本地选择zip文件
$("#zip-file-input").on("change", async function(e) {
    const file = e.target.files[0];
    if (!file) return;
    try {
        await parseZip(file);
        $("#csv-content-box").text("加载完成，点击左侧/右侧按钮查看单条CSV");
    } catch (err) {
        console.error("解析失败：", err);
        $("#csv-content-box").text("ZIP解析失败，请检查压缩包内文件命名格式");
    }
});

// 按钮点击切换查看CSV
$(".menu-btn").click(function () {
    const num = $(this).data("num");
    $(".menu-btn").removeClass("active");
    $(this).addClass("active");
    if (csvMap[num]) {
        $("#csv-content-box").text(csvMap[num]);
    }
});

// 【可选】远程加载zip（仅服务器环境可用，本地打开会跨域）
async function loadRemoteZip(zipUrl) {
    try {
        const res = await fetch(zipUrl, { cache: "no-cache" });
        if (!res.ok) throw new Error("文件不存在");
        const blob = await res.blob();
        await parseZip(blob);
    } catch (err) {
        $("#csv-content-box").text("远程加载失败，请改用上方本地上传ZIP");
        console.error(err);
    }
}

// 默认不自动远程加载，注释掉即可关闭
// $(()=> loadRemoteZip(`${currentPrefix}_data.zip`));
</script>
</body>
</html>
