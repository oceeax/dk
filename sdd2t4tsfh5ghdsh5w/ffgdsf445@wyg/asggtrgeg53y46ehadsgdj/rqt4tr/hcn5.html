<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>GitHub 文件管理器</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        sans-serif;
}

body{
    background:#121212;
    color:#e0e0e0;
    padding:16px;
    max-width:900px;
    margin:auto;
}

.box{
    background:#1e1e1e;
    padding:16px;
    border-radius:10px;
    margin-bottom:16px;
}

h3{
    color:#fff;
    font-size:18px;
    margin-bottom:14px;
}

label{
    display:block;
    color:#aaa;
    font-size:13px;
    margin:10px 0 5px;
}

input[type="text"],
input[type="password"]{
    width:100%;
    padding:11px 12px;
    background:#292929;
    border:1px solid #444;
    color:#fff;
    border-radius:5px;
    outline:none;
    font-size:14px;
}

input:focus{
    border-color:#2d78e4;
}

.btn-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:12px;
}

button{
    padding:9px 14px;
    background:#2d78e4;
    color:#fff;
    border:0;
    border-radius:5px;
    cursor:pointer;
    font-size:14px;
}

button:hover{
    background:#4088f0;
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

button.gray{
    background:#555;
}

button.del{
    background:#dc3545;
}

button.del:hover{
    background:#e45463;
}

#fileInput{
    display:none;
}

.progress-wrap{
    display:none;
    width:100%;
    height:16px;
    background:#333;
    border-radius:8px;
    overflow:hidden;
    margin-top:12px;
}

#progressBar{
    width:0%;
    height:100%;
    background:#2d78e4;
    transition:width .1s;
}

#progressText{
    display:none;
    color:#aaa;
    font-size:13px;
    margin-top:7px;
    word-break:break-word;
}

.status{
    margin-top:12px;
    padding:10px;
    background:#292929;
    border-radius:5px;
    font-size:13px;
    word-break:break-word;
}

.status.ok{
    color:#7bd88f;
}

.status.error{
    color:#ff7777;
}

.file-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    padding:11px 12px;
    margin:6px 0;
    background:#272727;
    border-radius:5px;
    flex-wrap:wrap;
}

.file-info{
    flex:1;
    min-width:150px;
    overflow:hidden;
}

.file-name{
    color:#fff;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.file-size{
    color:#888;
    font-size:12px;
    margin-top:3px;
}

.file-ops{
    display:flex;
    gap:6px;
}

.empty,
.loading{
    text-align:center;
    color:#888;
    padding:25px 10px;
    font-size:14px;
}

.small{
    color:#777;
    font-size:12px;
    line-height:1.6;
    margin-top:7px;
}

.title-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.warning{
    color:#e6b85c;
    background:#302a1d;
    padding:10px;
    border-radius:5px;
    margin-top:10px;
    font-size:12px;
    line-height:1.6;
}

.limit{
    color:#aaa;
    font-size:12px;
    margin-top:8px;
}

@media(max-width:600px){

    body{
        padding:10px;
    }

    .box{
        padding:13px;
    }

    .file-item{
        align-items:flex-start;
    }

    .file-ops{
        width:100%;
    }

    .file-ops button{
        flex:1;
    }

    button{
        padding:10px 12px;
    }
}

</style>
</head>

<body>


<!-- ================================
     GitHub 设置
================================ -->

<div class="box">

<h3>GitHub 设置</h3>


<label>GitHub Token</label>

<input
    type="password"
    id="token"
    placeholder="github_pat_xxxxxxxxxxxxx"
    autocomplete="off"
    spellcheck="false"
>


<label>GitHub 用户名</label>

<input
    type="text"
    id="username"
    placeholder="例如：osvs"
    autocomplete="off"
    spellcheck="false"
>


<label>仓库名称</label>

<input
    type="text"
    id="repo"
    placeholder="例如：my-files"
    autocomplete="off"
    spellcheck="false"
>


<label>目录</label>

<input
    type="text"
    id="folder"
    placeholder="例如：videos/2026，留空=根目录"
    autocomplete="off"
    spellcheck="false"
>


<div class="small">

目录支持多级，例如：

videos/2026

images/photo

files/test

留空则使用仓库根目录。

</div>


<div class="limit">

单个文件最大：
<strong>100 MB</strong>

</div>


<div class="btn-row">

<button onclick="testConnection()">
测试连接
</button>

<button
    class="gray"
    onclick="loadFiles()">

刷新文件

</button>

</div>


<div
    id="status"
    class="status">

等待操作

</div>

</div>



<!-- ================================
     上传
================================ -->

<div class="box">

<h3>上传文件</h3>


<div class="btn-row">

<button id="btnSelect">

选择本地文件上传

</button>


<input
    type="file"
    id="fileInput"
    multiple
>

</div>


<div
    class="progress-wrap"
    id="progressWrap">

<div id="progressBar"></div>

</div>


<div
    id="progressText">
</div>

</div>



<!-- ================================
     文件列表
================================ -->

<div class="box">

<div class="title-row">

<h3>当前目录文件</h3>


<button
    class="gray"
    onclick="loadFiles()">

刷新

</button>

</div>


<div id="fileList">

<div class="empty">

填写 GitHub 信息后刷新

</div>

</div>

</div>



<script>


/* =====================================
   常量
===================================== */

/*
   100 MB

   使用十进制 MB：
   100 × 1000 × 1000
*/

const MAX_FILE_SIZE =
    100 * 1000 * 1000;


/* =====================================
   DOM
===================================== */

const tokenInput =
    document.getElementById("token");

const usernameInput =
    document.getElementById("username");

const repoInput =
    document.getElementById("repo");

const folderInput =
    document.getElementById("folder");

const fileInput =
    document.getElementById("fileInput");

const btnSelect =
    document.getElementById("btnSelect");

const fileList =
    document.getElementById("fileList");

const statusBox =
    document.getElementById("status");

const progressWrap =
    document.getElementById("progressWrap");

const progressBar =
    document.getElementById("progressBar");

const progressText =
    document.getElementById("progressText");


/* =====================================
   获取配置
===================================== */

function getConfig(){

    const token =
        tokenInput.value.trim();

    const username =
        usernameInput.value.trim();

    const repo =
        repoInput.value.trim();

    let folder =
        folderInput.value.trim();


    /*
       清理目录前后的 /
    */

    folder =
        folder
        .replace(/^\/+/,"")
        .replace(/\/+$/,"");


    if(!token){

        throw new Error(
            "请输入 GitHub Token"
        );

    }


    if(!username){

        throw new Error(
            "请输入 GitHub 用户名"
        );

    }


    if(!repo){

        throw new Error(
            "请输入仓库名称"
        );

    }


    return {
        token,
        username,
        repo,
        folder
    };

}


/* =====================================
   GitHub API 基础地址
===================================== */

function repositoryApi(){

    const cfg =
        getConfig();

    return (
        "https://api.github.com/repos/" +
        encodeURIComponent(
            cfg.username
        ) +
        "/" +
        encodeURIComponent(
            cfg.repo
        )
    );

}


/* =====================================
   生成文件 API URL
===================================== */

function contentsApi(path=""){

    let url =
        repositoryApi() +
        "/contents";


    if(path){

        url += "/" +
            path
            .split("/")
            .map(
                part =>
                encodeURIComponent(part)
            )
            .join("/");

    }


    return url;

}


/* =====================================
   当前目录 API URL
===================================== */

function currentDirectoryApi(){

    const cfg =
        getConfig();


    if(!cfg.folder){

        return contentsApi();

    }


    return contentsApi(
        cfg.folder
    );

}


/* =====================================
   GitHub 请求
===================================== */

async function githubRequest(
    url,
    options={}
){

    const cfg =
        getConfig();


    const headers = {

        "Accept":
        "application/vnd.github+json",

        "Authorization":
        "Bearer " +
        cfg.token,

        "X-GitHub-Api-Version":
        "2022-11-28",

        ...options.headers

    };


    const response =
        await fetch(
            url,
            {
                ...options,
                headers
            }
        );


    let data = null;


    try{

        data =
            await response.json();

    }catch(e){}


    if(!response.ok){

        let message =
            "GitHub API 错误：" +
            response.status;


        if(
            data &&
            data.message
        ){

            message +=
                " - " +
                data.message;

        }


        throw new Error(
            message
        );

    }


    return data;

}


/* =====================================
   测试连接
===================================== */

async function testConnection(){

    try{

        setStatus(
            "正在测试 GitHub 连接..."
        );


        const data =
            await githubRequest(
                repositoryApi()
            );


        setStatus(
            "连接成功：" +
            data.full_name
        );


        await loadFiles();


    }catch(error){

        setStatus(
            "连接失败：" +
            error.message,
            true
        );

    }

}


/* =====================================
   选择文件
===================================== */

btnSelect.onclick = function(){

    fileInput.click();

};


fileInput.onchange =
async function(event){

    const files =
        event.target.files;


    if(
        !files ||
        files.length === 0
    ){

        return;

    }


    try{

        /*
           先检查全部文件大小。
           防止传到一半才发现超限。
        */

        for(
            const file of files
        ){

            if(
                file.size >
                MAX_FILE_SIZE
            ){

                throw new Error(
                    file.name +
                    " 超过 100 MB，" +
                    "无法上传。"
                );

            }

        }


        /*
           逐个上传
        */

        for(
            let i=0;
            i<files.length;
            i++
        ){

            await uploadFile(
                files[i],
                i,
                files.length
            );

        }


        await loadFiles();


    }catch(error){

        setStatus(
            "上传失败：" +
            error.message,
            true
        );

    }


    /*
       允许再次选择同一个文件
    */

    fileInput.value = "";

};


/* =====================================
   ArrayBuffer → Base64
===================================== */

function arrayBufferToBase64(
    buffer
){

    const bytes =
        new Uint8Array(buffer);


    const chunkSize =
        0x8000;


    let binary = "";


    for(
        let i=0;
        i<bytes.length;
        i+=chunkSize
    ){

        const chunk =
            bytes.subarray(
                i,
                Math.min(
                    i + chunkSize,
                    bytes.length
                )
            );


        binary +=
            String.fromCharCode(
                ...chunk
            );

    }


    return btoa(binary);

}


/* =====================================
   生成当前目录中的文件路径
===================================== */

function makeFilePath(
    filename
){

    const cfg =
        getConfig();


    if(
        !cfg.folder
    ){

        return filename;

    }


    return (
        cfg.folder +
        "/" +
        filename
    );

}


/* =====================================
   上传文件
===================================== */

async function uploadFile(
    file,
    index,
    total
){

    if(
        file.size >
        MAX_FILE_SIZE
    ){

        throw new Error(
            file.name +
            " 超过 100 MB"
        );

    }


    showProgress(
        0,
        "准备：" +
        file.name
    );


    /*
       读取文件
    */

    const buffer =
        await file.arrayBuffer();


    showProgress(
        20,
        "正在处理：" +
        file.name
    );


    /*
       GitHub Contents API
       要求 Base64 内容
    */

    const base64 =
        arrayBufferToBase64(
            buffer
        );


    /*
       当前目录下的完整路径
    */

    const path =
        makeFilePath(
            file.name
        );


    let sha = null;


    /*
       检查旧文件
    */

    try{

        const old =
            await githubRequest(
                contentsApi(path)
            );


        if(
            old &&
            old.sha
        ){

            sha =
                old.sha;

        }

    }catch(error){

        /*
           404 = 文件不存在
        */

        if(
            !error.message.includes(
                "404"
            )
        ){

            throw error;

        }

    }


    showProgress(
        50,
        sha
        ? "正在覆盖：" + file.name
        : "正在上传：" + file.name
    );


    const body = {

        message:
            sha
            ? "更新文件：" +
              file.name
            : "上传文件：" +
              file.name,

        content:
            base64

    };


    /*
       覆盖文件必须提供 sha
    */

    if(sha){

        body.sha =
            sha;

    }


    await githubRequest(
        contentsApi(path),
        {

            method:"PUT",

            headers:{
                "Content-Type":
                "application/json"
            },

            body:
            JSON.stringify(
                body
            )

        }
    );


    const percent =
        Math.round(
            (
                (index + 1) /
                total
            ) * 100
        );


    showProgress(
        percent,
        "上传完成：" +
        file.name
    );


    setStatus(
        "上传成功：" +
        file.name
    );

}


/* =====================================
   读取当前目录
===================================== */

async function loadFiles(){

    try{

        getConfig();

    }catch(error){

        fileList.innerHTML =
        `<div class="empty">
            ${escapeHtml(
                error.message
            )}
        </div>`;

        return;

    }


    fileList.innerHTML =
    `<div class="loading">
        正在读取目录...
    </div>`;


    try{

        const data =
            await githubRequest(
                currentDirectoryApi()
            );


        if(
            !Array.isArray(data)
        ){

            throw new Error(
                "指定路径不是目录"
            );

        }


        /*
           这里只显示文件。

           子目录不会丢失，
           只是不会把它们当成文件
           显示出来。
        */

        const files =
            data.filter(
                item =>
                item.type === "file"
            );


        if(
            files.length === 0
        ){

            fileList.innerHTML =
            `<div class="empty">
                当前目录没有文件
            </div>`;


            setStatus(
                "目录为空"
            );


            return;

        }


        let html = "";


        for(
            const item of files
        ){

            html += `

<div class="file-item">

    <div class="file-info">

        <div
            class="file-name"
            title="${escapeHtml(
                item.name
            )}">

            ${escapeHtml(
                item.name
            )}

        </div>

        <div class="file-size">

            ${formatBytes(
                item.size
            )}

        </div>

    </div>


    <div class="file-ops">

        <button
            onclick='downloadFile(
                ${JSON.stringify(item)}
            )'>

            下载

        </button>


        <button
            class="del"
            onclick='deleteFile(
                ${JSON.stringify(item)}
            )'>

            删除

        </button>

    </div>

</div>

`;

        }


        fileList.innerHTML =
            html;


        setStatus(
            "读取成功，共 " +
            files.length +
            " 个文件"
        );


    }catch(error){

        fileList.innerHTML =
        `<div class="empty">
            ${escapeHtml(
                error.message
            )}
        </div>`;


        setStatus(
            "读取失败：" +
            error.message,
            true
        );

    }

}


/* =====================================
   下载
===================================== */

window.downloadFile =
async function(item){

    try{

        setStatus(
            "正在准备下载：" +
            item.name
        );


        /*
           GitHub API 获取文件内容
        */

        const data =
            await githubRequest(
                contentsApi(
                    item.path
                    ? getRelativePath(
                        item.path
                    )
                    : item.name
                )
            );


        if(
            !data.content
        ){

            throw new Error(
                "GitHub 没有返回文件内容"
            );

        }


        const binary =
            atob(
                data.content
                .replace(/\s/g,"")
            );


        const bytes =
            new Uint8Array(
                binary.length
            );


        for(
            let i=0;
            i<binary.length;
            i++
        ){

            bytes[i] =
                binary.charCodeAt(i);

        }


        const blob =
            new Blob(
                [bytes]
            );


        const url =
            URL.createObjectURL(
                blob
            );


        const a =
            document.createElement(
                "a"
            );


        a.href =
            url;

        a.download =
            item.name;


        document.body.appendChild(a);

        a.click();

        a.remove();


        URL.revokeObjectURL(
            url
        );


        setStatus(
            "下载已开始：" +
            item.name
        );


    }catch(error){

        setStatus(
            "下载失败：" +
            error.message,
            true
        );

    }

};


/* =====================================
   取得相对于当前目录的路径
===================================== */

function getRelativePath(
    fullPath
){

    const cfg =
        getConfig();


    if(
        !cfg.folder
    ){

        return fullPath;

    }


    const prefix =
        cfg.folder + "/";


    if(
        fullPath.startsWith(
            prefix
        )
    ){

        return fullPath.substring(
            prefix.length
        );

    }


    return fullPath;

}


/* =====================================
   删除文件
===================================== */

window.deleteFile =
async function(item){

    if(
        !confirm(
            "确定删除这个文件吗？\n\n" +
            item.name
        )
    ){

        return;

    }


    try{

        setStatus(
            "正在删除：" +
            item.name
        );


        const relativePath =
            item.path
            ? getRelativePath(
                item.path
            )
            : item.name;


        await githubRequest(
            contentsApi(
                relativePath
            ),
            {

                method:"DELETE",

                headers:{
                    "Content-Type":
                    "application/json"
                },

                body:
                JSON.stringify({

                    message:
                    "删除文件：" +
                    item.name,

                    sha:
                    item.sha

                })

            }
        );


        setStatus(
            "删除成功：" +
            item.name
        );


        await loadFiles();


    }catch(error){

        setStatus(
            "删除失败：" +
            error.message,
            true
        );

    }

};


/* =====================================
   进度
===================================== */

function showProgress(
    percent,
    text
){

    progressWrap.style.display =
        "block";

    progressText.style.display =
        "block";


    progressBar.style.width =
        percent + "%";


    progressText.textContent =
        text +
        "　" +
        percent +
        "%";


    if(
        percent >= 100
    ){

        setTimeout(
            () => {

                progressWrap.style.display =
                    "none";

                progressText.style.display =
                    "none";

            },
            1000
        );

    }

}


/* =====================================
   状态
===================================== */

function setStatus(
    text,
    error=false
){

    statusBox.textContent =
        text;


    statusBox.className =
        error
        ? "status error"
        : "status ok";

}


/* =====================================
   文件大小
===================================== */

function formatBytes(
    bytes
){

    if(
        bytes === undefined ||
        bytes === null
    ){

        return "未知大小";

    }


    if(bytes === 0){

        return "0 B";

    }


    const units = [
        "B",
        "KB",
        "MB",
        "GB",
        "TB"
    ];


    const i =
        Math.floor(
            Math.log(bytes) /
            Math.log(1024)
        );


    return (
        (
            bytes /
            Math.pow(
                1024,
                i
            )
        )
        .toFixed(
            i === 0
            ? 0
            : 2
        )
        +
        " " +
        units[i]
    );

}


/* =====================================
   HTML 转义
===================================== */

function escapeHtml(
    str
){

    return String(str)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================
   初始化
===================================== */

fileList.innerHTML =
`
<div class="empty">

GitHub 文件管理器

<br>

<span style="color:#666">

目录留空 = 仓库根目录

</span>

</div>
`;

</script>

</body>
</html>
